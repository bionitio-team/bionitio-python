name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install cwltool
        run: pip3 install cwltool

      - name: Build Docker image
        run: docker build -t bionitio .

      - name: Run unit tests
        run: docker run --entrypoint /bionitio/.travis/unit-test.sh bionitio

      - name: Run functional tests
        run: docker run --entrypoint /bionitio/functional_tests/bionitio-test.sh bionitio -p bionitio -d /bionitio/functional_tests/test_data -v

      - name: Run CWL test
        run: cwltool bionitio.cwl --fasta_file functional_tests/test_data/two_sequence.fasta
